# ============================================
# 开发环境配置
# ============================================

server:
  port: 3000

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/employee_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 10000

# 开发环境日志
logging:
  level:
    com.employee: debug
    org.springframework.security: debug

# 开发环境关闭限流
resilience4j:
  ratelimiter:
    instances:
      api-limiter:
        limit-for-period: 999999
